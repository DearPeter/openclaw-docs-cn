{{ define "main" }}
    <h1>{{ .Title }}</h1>
    <div class="content">
        {{ .Content }}
    </div>
    
    {{ range .Pages }}
    <article>
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        {{ if .Summary }}
        <p>{{ .Summary }}</p>
        {{ end }}
    </article>
    {{ end }}
{{ end }}
