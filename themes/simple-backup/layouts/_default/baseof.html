<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        nav { background: #f5f5f5; padding: 10px; margin-bottom: 20px; }
        nav a { margin-right: 15px; }
        .content { line-height: 1.6; }
        footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; color: #666; }
    </style>
</head>
<body>
    <nav>
        <a href="/">首页</a>
        {{ range .Site.Menus.main }}
        <a href="{{ .URL }}">{{ .Name }}</a>
        {{ end }}
        {{ if hugo.IsMultilingual }}
        {{ range .Site.Languages }}
        <a href="{{ . | relLangURL }}">{{ .LanguageName }}</a>
        {{ end }}
        {{ end }}
    </nav>
    
    <div class="content">
        {{ block "main" . }}{{ end }}
    </div>
    
    <footer>
        <p>© {{ now.Format "2006" }} {{ .Site.Title }} - OpenClaw官方文档中文翻译</p>
        <p>源文档: <a href="https://docs.openclaw.ai/">docs.openclaw.ai</a></p>
    </footer>
</body>
</html>
