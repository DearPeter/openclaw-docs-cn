baseURL = 'https://dearpeter.github.io/openclaw-docs-cn/'
title = 'OpenClaw 中文文档'
theme = 'book'
copyright = '© 2026 OpenClaw Community. Licensed under MIT.'

disablePathToLower = true
enableGitInfo = true

# Multi-lingual mode config
[languages]
[languages.zh]
  languageName = '中文'
  contentDir = 'content/zh'
  weight = 1

[languages.en]
  languageName = 'English'
  contentDir = 'content/en'
  weight = 2

# Menu configuration (to be refined)
[menu]
[[menu.main]]
  name = '文档'
  pageRef = '/zh/'
  weight = 1

# Book theme parameters
[params]
  BookTheme = 'auto'
  BookSearch = true
  BookToC = true
  BookSection = 'docs'
  BookRepo = 'https://github.com/DearPeter/openclaw-docs-cn'
  BookEditLink = '{{ .Site.Params.BookRepo }}/edit/main/content/{{ .Lang }}/{{ .Path }}'
  BookDateFormat = '2006-01-02'
  # Colors (from design spec)
  primaryColor = '#0366d6'
  accentColor = '#28a745'
  # Fonts
  fontFamily = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif'
  codeFontFamily = '"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace'

# Markup configuration
[markup]
[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 1

[markup.highlight]
  style = 'github'